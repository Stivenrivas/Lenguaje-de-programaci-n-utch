<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choco Turismo - Iniciar Sesion</title>
    <link rel="icon" type="image/png" href="/favicon/favicon.png">
    <link rel="stylesheet" href="/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-sidebar">
            <div class="sidebar-content">
                <i class="fas fa-palm-tree"></i>
                <h1>Choco Turismo</h1>
                <p>Descubre los destinos mas hermosos del Pacifico colombiano</p>
                <div class="sidebar-features">
                    <div class="feature"><i class="fas fa-umbrella-beach"></i> Playas virgenes</div>
                    <div class="feature"><i class="fas fa-tree"></i> Selva tropical</div>
                    <div class="feature"><i class="fas fa-drum"></i> Cultura viva</div>
                </div>
            </div>
        </div>
        <div class="auth-main">
            <div class="auth-container">
                <div id="floatAlert" class="float-alert" style="display:none;"></div>
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">Iniciar Sesion</button>
                    <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
                </div>

                <!-- Login Form -->
                <div id="loginForm" class="auth-form active">
                    <h2><i class="fas fa-sign-in-alt"></i> Bienvenido de nuevo</h2>
                    <p class="auth-subtitle">Accede para explorar el Choco</p>
                    <form onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" required placeholder="Correo electronico">
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" required placeholder="Contrasena">
                            <span class="toggle-pw" onclick="togglePass('loginPassword',this)"><i class="fas fa-eye"></i></span>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                    </form>
                    <div id="loginError" class="alert alert-error" style="display:none;"></div>
                    <div class="demo-info">
                        <i class="fas fa-info-circle"></i>
                        Demo: <strong>admin@turismo.com</strong> / <strong>admin123</strong>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="registerForm" class="auth-form">
                    <h2><i class="fas fa-user-plus"></i> Crear cuenta</h2>
                    <p class="auth-subtitle">Registrate y descubre el Choco</p>
                    <form onsubmit="handleRegister(event)">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regNombre" required placeholder="Nombre completo">
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="regEmail" required placeholder="Correo electronico">
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" required placeholder="Contrasena (min. 8 caracteres)" minlength="8">
                            <span class="toggle-pw" onclick="togglePass('regPassword',this)"><i class="fas fa-eye"></i></span>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regConfirm" required placeholder="Confirmar contrasena">
                            <span class="toggle-pw" onclick="togglePass('regConfirm',this)"><i class="fas fa-eye"></i></span>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fas fa-user-plus"></i> Crear cuenta</button>
                    </form>
                    <div id="registerError" class="alert alert-error" style="display:none;"></div>
                    <div id="registerSuccess" class="alert alert-success" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/login.js"></script>
</body>
</html>

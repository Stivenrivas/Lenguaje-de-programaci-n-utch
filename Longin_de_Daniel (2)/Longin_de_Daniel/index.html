<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
<link rel="shortcut icon" href="favicon/favicon-32x32.png" type="image/x-icon">
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="login-wrapper">
<div class="card login-card z-depth-3">
    <div class="card-content">

    <!-- Logo -->
    <div class="avatar">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
    </svg>
    </div>

    <h5 class="login-title">Iniciar sesión</h5>
    <p class="login-sub grey-text">Bienvenido de nuevo 👋</p>

    <!-- Email -->
    <div class="row mb-0">
        <div class="input-field col s12">
        <i class="material-icons prefix">email</i>
        <input id="email" type="email"/>
        <label for="email">Correo electrónico</label>
        </div>
    </div>

    <!-- contaraseña -->
    <div class="row mb-0">
        <div class="input-field col s12">
        <i class="material-icons prefix">lock</i>
        <input id="password" type="password"/>
        <label for="password">Contraseña</label>
        </div>
    </div>

    <!-- recuerdame -->
    <div class="row options-row">
        <div class="col s6">
        <label>
            <input type="checkbox"/>
            <span class="grey-text text-darken-1">Recuérdame</span>
        </label>
        </div>
        <div class="col s6 right-align">
        <a href="#" class="blue-text text-darken-3 forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <!-- Login button -->
    <div class="row">
        <div class="col s12">
        <a href="#" class="btn btn-large waves-effect waves-light blue darken-3 full-width">
            Entrar
        </a>
        </div>
    </div>

    <!-- Divider -->
    <div class="divider-text">
        <span class="grey-text">o</span>
    </div>

    <!-- Google button -->
    <div class="row">
        <div class="col s12">
        <a href="#" class="btn btn-large waves-effect waves-grey white google-btn full-width grey-text text-darken-2">
            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            Continuar con Google
        </a>
        </div>
    </div>

    <!-- Footer -->
    <p class="center-align grey-text foot-text">
        ¿No tienes cuenta? <a href="#" class="blue-text text-darken-3 register-link">Regístrate</a>
    </p>

    </div>
</div>
</div>

</body>
</html>
